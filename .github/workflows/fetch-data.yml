# Fetch all external data sources weekly and store in data branch
name: Fetch All Data

on:
  schedule:
    # Wednesday 10:00 UTC: SARI publishes the past week on Tuesday, but MedUni
    # has updated the Sentinel charts as late as Wednesday 08:30 UTC, so an
    # earlier run kept Sentinel a week behind.
    - cron: '0 10 * * 3'
    # Saturday 06:00 UTC: AGES publishes its wastewater week on Friday, so a
    # Wednesday-only run kept that feed a week behind.
    - cron: '0 6 * * 6'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (for scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main

      - name: Checkout data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
        continue-on-error: true  # Branch may not exist yet

      - name: Create data branch if needed
        run: |
          if [ ! -d "data/.git" ]; then
            mkdir -p data
            cd data
            git init
            git checkout -b data
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r main/tools/requirements.txt

      - name: Fetch all data
        working-directory: main/tools
        run: python fetch_all_data.py --output-dir ../../data/

      - name: Commit and push data
        # Runs even when the fetch failed the run, e.g. because one source stopped
        # publishing: the other feeds are still fresh and must reach the dashboard.
        # The job stays red, so the stale source is not silently tolerated.
        # Not always(): a cancelled job may have been interrupted mid-write.
        if: success() || failure()
        run: |
          cd data
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "chore: update data $(date +%Y-%m-%d)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data
